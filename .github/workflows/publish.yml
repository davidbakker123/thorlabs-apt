name: Publish Thorlabs APT

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: pypi

        permissions:
            id-token: write
            
        steps:
            
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v6
              
            - name: Build package
              run: uv build

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1