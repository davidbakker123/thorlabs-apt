name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  UV_USE_ACTIVE_ENV: 1

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install uv
        uses: yezz123/setup-uv@v4
        with:
          uv-version: 0.12.5

      - name: Install tox
        run: pip install tox
                  
      - name: Run lint
        run: tox -e lint

  type:
    name: Type check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install uv
        uses: yezz123/setup-uv@v4
        with:
          uv-version: 0.12.5

      - name: Install tox
        run: pip install tox
                  
      - name: Run type check
        run: tox -e type

  test:
    name: Tests 
    needs: type

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Install uv
        uses: yezz123/setup-uv@v4
        with:
          uv-version: 0.12.5

      - name: Install tox
        run: pip install tox
                  
      - name: Run tests
        run: tox -e test
  
